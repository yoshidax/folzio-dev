name: macOS Swift CI

on:
  pull_request:
    # TEMPORARY: "synchronize" lets pushes to this PR re-run CI while the build is being fixed. Remove it before merging.
    types: [opened, ready_for_review, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (macOS 15 / arm64)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # The code needs a newer Swift toolchain than the runner's default Xcode (16.4 / Swift 6.1.2).
      XCODE_VERSION: "26.3"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode_*.app
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

      - name: Show toolchain
        run: |
          uname -m
          xcode-select -p
          swift --version

      - name: Build
        run: swift build

      - name: Test (excluding performance tests)
        run: swift test --skip FolzioPerformanceTests

      # Performance thresholds are absolute times, so they can fail on a busy shared runner.
      # Keep the result visible without turning the job red until the variance is known.
      - name: Performance tests (non-blocking)
        continue-on-error: true
        run: swift test --filter FolzioPerformanceTests