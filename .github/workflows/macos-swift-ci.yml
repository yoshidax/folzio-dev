name: macOS Swift CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      verify_artifact_retry:
        description: Verify failed-job retry with the previous attempt's artifact
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (macOS 15 / arm64)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # Build with the oldest supported toolchain (Xcode 16.0 / Swift 6.0), matching the documented minimum.
      XCODE_VERSION: "16.0"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode_*.app
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

      - name: Show toolchain
        run: |
          uname -m
          xcode-select -p
          swift --version

      - name: Test publication script
        run: |
          status=0
          for pattern in test_publish_folzio.py test_strip_readme_dev_note.py test_package_release.py test_release_distribution.py 'test_check_*.py'; do
            python3 -I -m unittest discover -s scripts/dev/tests -p "$pattern" -v || status=1
          done
          exit "$status"

      - name: Verify read-only public release APIs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYAPI'
          import sys
          sys.path.insert(0, 'scripts')
          import release
          api = release.GitHub(release.PUBLIC_REPO)
          print('Readable public releases:', len(api.pages('releases')))
          tags = api.api('git/matching-refs/tags/')
          print('Readable public tags:', len(tags))
          if tags:
              release.tag_commit(api, tags[0]['ref'][len('refs/tags/'):])
          PYAPI

      - name: Build
        run: swift build

      # A hung test would otherwise hold the macOS runner until the 30-minute job limit.
      - name: Test (excluding performance tests)
        timeout-minutes: 10
        run: swift test --no-parallel --skip FolzioPerformanceTests

      # Performance thresholds are absolute times, so they can fail on a busy shared runner.
      # Keep the result visible without turning the job red until the variance is known.
      - name: Performance tests (non-blocking)
        continue-on-error: true
        timeout-minutes: 10
        run: swift test --filter FolzioPerformanceTests

  artifact-plan:
    name: Produce release handoff probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Prepare probe
        run: printf '%s\n' "$GITHUB_RUN_ID" > "$RUNNER_TEMP/retry-probe.txt"
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: release-handoff-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/retry-probe.txt
          if-no-files-found: error
          retention-days: 1
  artifact-retry:
    name: Verify release artifact handoff
    needs: artifact-plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.artifact-plan.outputs.artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/retry-probe
      - name: Verify preserved input
        env:
          VERIFY_RETRY: ${{ inputs.verify_artifact_retry }}
        run: |
          test "$(cat "$RUNNER_TEMP/retry-probe/retry-probe.txt")" = "$GITHUB_RUN_ID"
          if [[ "$VERIFY_RETRY" == true && "$GITHUB_RUN_ATTEMPT" == 1 ]]; then
            echo 'Intentional first-attempt failure. Re-run failed jobs to verify the original artifact ID.'
            exit 1
          fi
          echo "Verified original producer artifact on attempt $GITHUB_RUN_ATTEMPT"
