name: macOS Swift CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-actions-lock:
    name: Verify workflow dependency lockfiles
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      XDG_DATA_HOME: ${{ runner.temp }}/verified-gh-data
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - name: Install lockfile verifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(uname -s)-$(uname -m)" = Linux-x86_64
          gh extension install github/gh-actions-lock --pin v0.4.1
          printf '%s  %s\n' '39deb2fe714dbf74b073d8245fc7f3d50cd0eee18d5c0900e9e849ae933ae17e' "$XDG_DATA_HOME/gh/extensions/gh-actions-lock/gh-actions-lock" | sha256sum --check
      - name: Verify development and public workflow locks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/dev/actions-lock.py --verify

  build-and-test:
    name: Build and test (macOS 15 / arm64)
    needs: verify-actions-lock
    # A skipped required job would pass branch protection, so fail explicitly when verification fails.
    if: ${{ always() }}
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # Build with the oldest supported toolchain (Xcode 16.0 / Swift 6.0), matching the documented minimum.
      XCODE_VERSION: "16.0"

    steps:
      - name: Require successful lockfile verification
        env:
          LOCK_VERIFICATION: ${{ needs.verify-actions-lock.result }}
        run: test "$LOCK_VERIFICATION" = success

      - name: Check out source
        uses: actions/checkout@v4.4.0

      - name: Check public source snapshot
        run: bash scripts/dev/export-public.sh "$(git rev-parse HEAD)" "$RUNNER_TEMP/public-source"

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode_*.app
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

      - name: Show toolchain
        run: |
          uname -m
          xcode-select -p
          swift --version

      - name: Test publication script
        run: |
          status=0
          for pattern in test_publish_folzio.py test_strip_readme_dev_note.py test_package_release.py test_release_distribution.py 'test_check_*.py'; do
            python3 -I -m unittest discover -s scripts/dev/tests -p "$pattern" -v || status=1
          done
          exit "$status"

      - name: Build
        run: swift build

      - name: Check pasteboard probe
        run: swift -swift-version 6 scripts/dev/pasteboard-probe.swift --self-test

      # A hung test would otherwise hold the macOS runner until the 30-minute job limit.
      - name: Test (excluding performance tests)
        timeout-minutes: 10
        run: swift test --no-parallel --skip FolzioPerformanceTests

      # Performance thresholds are absolute times, so they can fail on a busy shared runner.
      # Keep the result visible without turning the job red until the variance is known.
      - name: Performance tests (non-blocking)
        continue-on-error: true
        timeout-minutes: 10
        run: swift test --filter FolzioPerformanceTests
