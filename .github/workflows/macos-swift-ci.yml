name: macOS Swift CI

on:
  pull_request:
    types: [opened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (macOS 15 / arm64)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # Build with the oldest supported toolchain (Xcode 16.0 / Swift 6.0), matching the documented minimum.
      XCODE_VERSION: "16.0"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode_*.app
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

      - name: Show toolchain
        run: |
          uname -m
          xcode-select -p
          swift --version

      - name: Build
        run: swift build

      # A hung test would otherwise hold the macOS runner until the 30-minute job limit.
      - name: Test (excluding performance tests)
        timeout-minutes: 10
        run: swift test --no-parallel --skip FolzioPerformanceTests

      # Performance thresholds are absolute times, so they can fail on a busy shared runner.
      # Keep the result visible without turning the job red until the variance is known.
      - name: Performance tests (non-blocking)
        continue-on-error: true
        timeout-minutes: 10
        run: swift test --filter FolzioPerformanceTests

  # Checks that need no Swift run on a Linux runner, independently of the macOS job.
  # They share the workflow triggers, so they run on the same events as the build and test.
  spec-checks:
    name: Spec format check (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Python
        run: python3 --version

      - name: Check specs/product format
        run: python3 scripts/dev/check-spec-format.py

      - name: Test the spec checkers
        run: python3 -I -m unittest discover -s scripts/dev/tests -p "test_check_spec_*.py"