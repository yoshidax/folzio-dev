name: macOS Swift CI

on:
  pull_request:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-swift-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (macOS 15 / arm64)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          uname -m
          xcode-select -p
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test
