name: Publish release source
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Merged release PR commit (complete SHA)
        required: true
        type: string
      candidate_run_id:
        description: Run containing the candidate you checked locally
        required: true
        type: string
      bootstrap_public_base:
        description: Current public main SHA (first publication only)
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
  pull-requests: read
# 共通 concurrency の pending 置換は使わず、書き込み直前の base 照合と非 force 更新で競合を拒否する。
jobs:
  plan:
    if: github.repository == 'yoshidax/folzio-dev' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      state: ${{ steps.plan.outputs.state }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      plan_digest: ${{ steps.plan.outputs.plan_digest }}
      payload_digest: ${{ steps.plan.outputs.payload_digest }}
      input_artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          BOOTSTRAP_PUBLIC_BASE: ${{ inputs.bootstrap_public_base }}
        run: |
          python3 scripts/dev/sync-public.py sync-plan --source-sha "$SOURCE_SHA" --candidate-run-id "$CANDIDATE_RUN_ID" --bootstrap-public-base "$BOOTSTRAP_PUBLIC_BASE" --directory "$RUNNER_TEMP/sync"
      - uses: actions/upload-artifact@v4.6.2
        id: upload
        if: steps.plan.outputs.state == 'write' || steps.plan.outputs.state == 'rebuild'
        with:
          name: sync-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sync/
          if-no-files-found: error
          retention-days: 30
  rebuild:
    name: Rebuild release candidate
    needs: plan
    if: needs.plan.outputs.state == 'rebuild'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4.3.0
        with:
          artifact-ids: ${{ needs.plan.outputs.input_artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/sync
      - name: Restore verified source modes
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          EXPECTED_PAYLOAD_DIGEST: ${{ needs.plan.outputs.payload_digest }}
        run: python3 scripts/dev/sync-public.py unpack --directory "$RUNNER_TEMP/sync"
      - name: Select toolchain
        run: |
          test "$(uname -m)" = arm64
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          swift --version
      - name: Validate and package candidate
        run: bash scripts/dev/validate-release-candidate.sh "$RUNNER_TEMP/sync/source" "$RUNNER_TEMP/sync/candidate"
      - id: record
        run: python3 scripts/dev/sync-public.py record --directory "$RUNNER_TEMP/sync/source" --info "$RUNNER_TEMP/sync/candidate-info.json"
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ steps.record.outputs.artifact_name }}
          path: ${{ runner.temp }}/sync/candidate/
          if-no-files-found: error
          retention-days: 30

  write:
    needs: plan
    if: needs.plan.outputs.state == 'write'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4.3.0
        with:
          artifact-ids: ${{ needs.plan.outputs.input_artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/sync
      - uses: actions/create-github-app-token@v3.3.0
        id: token
        with:
          client-id: ${{ vars.PUBLIC_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUBLIC_SYNC_APP_PRIVATE_KEY }}
          owner: yoshidax
          repositories: folzio
          permission-contents: write
          permission-workflows: write
      - name: Write verified public tree
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          EXPECTED_SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          EXPECTED_PLAN_DIGEST: ${{ needs.plan.outputs.plan_digest }}
          EXPECTED_PAYLOAD_DIGEST: ${{ needs.plan.outputs.payload_digest }}
        run: python3 scripts/dev/sync-public.py write --directory "$RUNNER_TEMP/sync"

  await-verification:
    name: Await local verification
    needs: [plan, rebuild]
    if: >-
      always() && needs.plan.result == 'success' &&
      (needs.plan.outputs.state == 'bootstrap' ||
      (needs.plan.outputs.state == 'rebuild' && needs.rebuild.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Await local verification
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          STATE: ${{ needs.plan.outputs.state }}
        run: |
          echo "::error title=Not published::Awaiting local verification or bootstrap confirmation for $SOURCE_SHA ($STATE)."
          echo "Not published. Check the candidate for $SOURCE_SHA, then resume with this source SHA, the checked candidate run ID, and the initial public base if required." >> "$GITHUB_STEP_SUMMARY"
          exit 1
