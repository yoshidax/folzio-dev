schema_version: "1.0"
workflow:
  id: "sdd-increment-kilo"
  name: "SDD increment (Kilo)"
  version: "0.5.0"
  author: "igachan"
  # spec-kit は command / prompt を integration の CLI アダプタ経由でしか実行できない。
  # 公式の kilocode integration には CLI ディスパッチがないため、Kilo CLI (kilo) と
  # 互換性のある opencode アダプタを実行ファイル差し替えで使う。
  # 必ず scripts/dev/sdd-run-kilo.sh から実行すること
  # （SPECKIT_INTEGRATION_OPENCODE_EXECUTABLE=kilo と SPECKIT_INTEGRATION_OPENCODE_EXTRA_ARGS=--auto を設定する）。
  integration: "opencode"
  # メインエージェント（command / prompt の各 step）を固定する
  model: "byteplus-model-ark/deepseek-v4-1-flash-261017"
  description: >-
    既存のプロダクトへの追加要件を新しい feature として、specify → clarify → plan → tasks → analyze と修正のループ →
    実装・検証・converge のループ → specs/product/ への反映で進める。
    Kilo CLI をバックエンドにする。人が判断するのは、clarify（manual のとき）、設計のレビュー、GUI の起動確認、specs/product/ への反映の確認の4か所だけ

requires:
  # command / prompt の手順の capture: true は v1.2.1 から
  speckit_version: ">=1.2.1"
  integrations:
    # コマンド本体は .kilo/commands に配置された kilocode integration のものを使う（advisory）
    any: ["kilocode"]

inputs:
  change:
    type: string
    required: true
    prompt: "追加・変更したい要件"
  base_branch:
    type: string
    default: "master"
    prompt: "feature ブランチを切る元のブランチ"
  clarify_mode:
    type: string
    default: "auto"
    enum: ["auto", "manual", "skip"]
    prompt: "clarify の進め方（auto: 推奨回答を自動で採用し、後のレビューでまとめて確認 / manual: Kilo Code で対話 / skip: 行わない。小さな変更向け）"

steps:
  # ── 0. 事前チェック ─────────────────────────────────────────────
  # specify の before_specify フック（git 拡張の speckit.git.feature）が今の HEAD から feature ブランチを切るため、
  # クリーンな元のブランチから始める
  - id: preflight
    type: shell
    run: |
      branch=$(git branch --show-current)
      if [ "$branch" != "{{ inputs.base_branch }}" ]; then
        echo "{{ inputs.base_branch }} で実行してください（現在: $branch）" >&2; exit 1
      fi
      if [ -n "$(git status --porcelain)" ]; then
        echo "未コミットの変更があります。コミットするか stash してから実行してください" >&2; exit 1
      fi
      # 直接実行すると opencode アダプタが kilo 以外を指し、非対話の許可も渡らない
      case "${SPECKIT_INTEGRATION_OPENCODE_EXECUTABLE:-}:${SPECKIT_INTEGRATION_OPENCODE_EXTRA_ARGS:-}" in
        kilo:*--auto*) ;;
        *) echo "scripts/dev/sdd-run-kilo.sh から実行してください（kilo の実行ファイル指定と --auto が渡りません）" >&2; exit 1 ;;
      esac

  # ── 1. 新しい feature の仕様 ─────────────────────────────────────
  # 現在の仕様の正本は specs/product/。新しい feature の spec.md には変更点だけを書く（書き方は specs/product/README.md）。
  # 非対話実行では質問に答えられないため、推奨回答を採用し、決められない点は出力に残す。出力は 4. のレビューで表示する
  - id: specify
    type: prompt
    capture: true
    timeout: 1800
    prompt: |
      /speckit.specify {{ inputs.change }}

      これは既存のプロダクトへの追加・変更です。現在の仕様の正本は specs/product/ です。
      先に specs/product/README.md と、この変更に関係する領域のファイルを読んでください。
      spec.md は specs/product/README.md の「feature の spec.md の書き方」と「ID の付け方」に従い、変更点だけを書いてください。
      specs/product/ はこの段階では変更しないでください。
      この実行では対話できません。[NEEDS CLARIFICATION] は推奨回答を採用して埋めてください。推奨を決められないものはマーカーのまま残してください。
      最後に「作った feature ディレクトリ」「採用した推奨回答」「残したマーカー（選択肢と推奨）」を一覧で出力してください。

  - id: check_branch
    type: shell
    run: |
      branch=$(git branch --show-current)
      if [ "$branch" = "{{ inputs.base_branch }}" ]; then
        echo "feature ブランチが作られていません（before_specify フックを確認してください）" >&2; exit 1
      fi
      echo "feature ブランチ: $branch"

  # 後の手順のスクリプトは .specify/feature.json で feature を選ぶ。エージェントの書き込みが失敗すると
  # 前の feature を指したまま進むため、ブランチから決めて shell で書く
  - id: set_feature
    type: shell
    run: |
      dir="specs/$(git branch --show-current)"
      [ -f "$dir/spec.md" ] || { echo "$dir/spec.md がありません（specify の結果を確認してください）" >&2; exit 1; }
      printf '{\n  "feature_directory": "%s"\n}\n' "$dir" > .specify/feature.json
      echo "feature: $dir"

  # ── 2. 仕様の明確化（skip のときは行わない） ─────────────────────────
  # clarify は feature の spec.md しか読まないため、関係する specs/product/ の領域との矛盾と影響範囲も質問の候補にさせる
  - id: clarify
    type: if
    condition: "{{ inputs.clarify_mode == 'auto' }}"
    then:
      - id: clarify_auto
        type: prompt
        capture: true
        timeout: 1800
        prompt: |
          /speckit.clarify {{ inputs.change }}

          spec.md が参照している specs/product/ の領域のファイルも読み、既存の仕様との矛盾と、変更の影響が及ぶ既存の項目も
          質問の候補に含めてください。
          この実行では対話できません。各質問は、提示する推奨回答をそのまま採用して spec.md に反映してください。
          推奨を決められない（ユーザーの判断が必要な）質問は採用しないでください。
          最後に「採用した回答」と「未決の質問（選択肢と推奨）」を一覧で出力してください。

  - id: clarify_by_hand
    type: if
    condition: "{{ inputs.clarify_mode == 'manual' }}"
    then:
      - id: notify_clarify
        type: shell
        run: scripts/dev/sdd-notify.sh "clarify を対話で行ってください"
      - id: clarify_manual
        type: gate
        message: |
          Kilo Code で `/speckit.clarify <追加要件>` を実行し、質問に答えて spec.md を更新してから approve してください。
          spec.md が参照している specs/product/ の領域との矛盾と影響範囲も確認してください。
        options: [approve, reject]
        on_reject: abort

  # plan は未決のマーカーがあると止まるため、残っていれば先に止める（Kilo Code で決めて spec.md に反映してから resume）
  - id: check_clarified
    type: shell
    run: |
      dir=$(python3 -c 'import json; print(json.load(open(".specify/feature.json"))["feature_directory"])')
      if grep -n 'NEEDS CLARIFICATION' "$dir/spec.md" >&2; then
        echo "$dir/spec.md に未決の項目があります。Kilo Code で決めて反映してから resume してください" >&2; exit 1
      fi

  # ── 3. 設計とタスク（間にゲートを置かない。レビューは 4. でまとめて行う） ──
  # prompt の手順は「止めた」と出力しても成功扱いになるため、成果物ができたかを shell で確かめる
  - id: plan
    command: speckit.plan

  - id: check_plan
    type: shell
    run: |
      dir=$(python3 -c 'import json; print(json.load(open(".specify/feature.json"))["feature_directory"])')
      [ -f "$dir/plan.md" ] || { echo "$dir/plan.md が作られていません。plan の出力を確認してから resume してください" >&2; exit 1; }

  - id: tasks
    command: speckit.tasks

  - id: check_tasks
    type: shell
    run: |
      dir=$(python3 -c 'import json; print(json.load(open(".specify/feature.json"))["feature_directory"])')
      [ -f "$dir/tasks.md" ] || { echo "$dir/tasks.md が作られていません。tasks の出力を確認してから resume してください" >&2; exit 1; }

  # ── 4. 分析と修正のループ（analyze は tasks.md ができてから実行する） ──
  - id: review_loop
    type: do-while
    max_iterations: 3
    condition: "{{ steps.review_gate.output.choice == 'fix' }}"
    steps:
      - id: analyze
        command: speckit.analyze
        capture: true
        timeout: 1800

      - id: notify_review
        type: shell
        run: scripts/dev/sdd-notify.sh "設計レビュー待ち（analyze の結果を確認してください）"

      - id: review_gate
        type: gate
        message: |
          ── specify の結果 ──
          {{ steps.specify.output.stdout }}

          ── clarify の結果 ──
          {{ steps.clarify_auto.output.stdout | default('（manual で実行、または skip）') }}

          ── analyze のレポート ──
          {{ steps.analyze.output.stdout }}

          spec / plan / tasks の差分（git diff）も確認してください。
            approve: 実装へ進む
            fix:     レポートの推奨どおりに直して、もう一度 analyze する
            reject:  一時停止（直してから resume すると、このレビューからやり直す）
          未決の質問や人の判断が要る指摘は、Kilo Code で決めて反映してから approve か fix を選んでください。
        options: [approve, fix, reject]
        # abort だと resume できなくなるため、一時停止にする
        on_reject: retry

      - id: apply_fixes
        type: if
        condition: "{{ steps.review_gate.output.choice == 'fix' }}"
        then:
          - id: apply_fixes_prompt
            type: prompt
            # prompt の手順は capture しなくても既定で 300 秒で打ち切られる
            timeout: 3600
            prompt: |
              次の analyze（`/speckit.analyze`）のレポートの指摘のうち、CRITICAL・HIGH・MEDIUM を推奨どおりに
              作業中の feature ディレクトリの spec.md・plan.md・research.md・data-model.md・contracts/・quickstart.md・tasks.md へ反映してください。
              完了済み（[X]）のタスクは書き換えず、注記で対応してください。アプリのコードとテスト、および specs/product/ は変更しないでください
              （specs/product/ への反映は実装の後に行います）。
              人の判断が必要で推奨を決められない指摘は反映せず、最後に一覧で示してください。

              {{ steps.analyze.output.stdout }}

  # 実装の sub agent は worktree を Phase ブランチから切るため、文書を先にコミットする（docs_private/agents/parallel-worktree.md）
  - id: commit_docs
    type: shell
    run: |
      git add specs
      git diff --cached --quiet || git commit -q -m "docs: specify the next increment (spec, plan, tasks)"

  # ── 5. 実装・検証・converge のループ（converge がタスクを追記したら繰り返す） ──
  - id: delivery
    type: do-while
    max_iterations: 3
    condition: "{{ steps.converge_check.output.stdout }}"
    steps:
      # 長く動くため capture しない（途中経過をターミナルに流す）
      - id: implement
        command: speckit.implement
        input:
          args: >-
            実装してください。docs_private/agents/parallel-worktree.md の worktree 規約に従い、ファイルが重ならない作業を並行化する場合は、
            `git worktree add` で作業ツリーを分けてから
            `kilo run --dir <worktree> --auto -m byteplus-model-ark/deepseek-v4-1-flash-261017 "<作業指示>"` を並行して起動してください。
            `kilo run` を並行起動できない場合は、同じ worktree 規約で直列に実装してください。
            内部の task サブエージェントは調査・レビューにだけ使い、実装の並列化には使わないでください。
            統合は Phase ブランチへ git merge --no-ff で行い、各マージ後に swift build と swift test を通してください。
            GUI の起動確認が必要なタスクは実施せず、未チェックのまま残してください。GUI は起動しないでください

      # AGENTS.md の Phase の検証ゲート 1〜3 と、起動スモーク用の .app の作成
      - id: verify
        type: shell
        timeout: 3600
        run: swift build && swift test && scripts/check-no-network.sh && scripts/check-readme-sync.sh master && scripts/make-app.sh

      - id: notify_gui
        type: shell
        run: scripts/dev/sdd-notify.sh "GUI の起動確認待ち"

      - id: gui_smoke
        type: gate
        message: |
          古い Folzio を終了してから `open .build/Folzio.app` で起動し、tasks.md の未チェックの
          検証タスクが指す quickstart.md のシナリオを確認してください。問題がなければ approve してください。
          問題があれば reject で一時停止し、直して `scripts/make-app.sh` を実行してから resume してください（この確認からやり直します）。
        options: [approve, reject]
        on_reject: retry

      - id: record
        type: prompt
        timeout: 1200
        prompt: |
          ユーザーが GUI の起動確認を終え、問題がないと報告しました。作業中の feature の tasks.md の未チェックの検証タスク（GUI 確認を含むもの）
          について、その feature ディレクトリの checklists/validation.md（なければ specs/001-three-pane-media-viewer/checklists/validation.md の
          形式に倣って作る）に結果（実行日、OS、確認項目、合否）を記録し、そのタスクを [X] にして、tasks.md と validation.md をコミットしてください。
          以前の Phase から残っている、今回の対象ではない未チェックのタスクには触れないでください。

      - id: converge
        command: speckit.converge
        capture: true
        timeout: 1800

      # converge がタスクを追記したかは、出力の文言ではなく tasks.md の変更で判定する（文言の揺れに左右されない）
      - id: converge_check
        type: shell
        run: |
          tasks=$(.specify/scripts/bash/check-prerequisites.sh --json --paths-only \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["TASKS"])')
          if git diff --quiet -- "$tasks"; then echo false; else echo true; fi

  # ── 6. specs/product/ への反映（以後の正本になるため、人が確認してからコミットする） ──
  - id: merge_back
    type: prompt
    capture: true
    timeout: 1800
    prompt: |
      作業中の feature（.specify/feature.json の feature_directory）の実装と検証が終わりました。
      specs/product/README.md の「更新の流れ」と「feature の spec.md の書き方」に従い、feature の spec.md の「反映先」の表にある項目を
      specs/product/ の領域のファイルへ反映してください。
      - 追加は反映先のファイルの該当する見出しの下に置き、変更は同じ ID の項目を書き換え、削除は項目を消してください
      - 横断の契約に関わる変更は、feature の contracts/ の内容を specs/product/contracts/ へ反映してください
      - 最後に feature の spec.md の冒頭へ、移行済み・凍結の注記を入れてください
      コミットはしないでください。最後に、反映した項目（ID・種別・反映先）と、反映先を決められなかった項目を一覧で出力してください。

  - id: notify_merge_back
    type: shell
    run: scripts/dev/sdd-notify.sh "specs/product/ への反映を確認してください"

  - id: merge_back_gate
    type: gate
    message: |
      ── specs/product/ への反映 ──
      {{ steps.merge_back.output.stdout }}

      `git diff -- specs` で差分を確認してください。
        approve: 反映をコミットする
        reject:  一時停止（直してから resume すると、この確認からやり直す）
    options: [approve, reject]
    on_reject: retry

  - id: commit_product
    type: shell
    run: |
      git add specs
      git diff --cached --quiet || git commit -q -m "docs: reflect the increment into specs/product"

  - id: notify_summary
    type: shell
    run: scripts/dev/sdd-notify.sh "specs/product/ への反映まで終わりました。結果を確認してください"

  - id: summary
    type: gate
    message: |
      ── converge の結果 ──
      {{ steps.converge.output.stdout }}

      feature ブランチを {{ inputs.base_branch }} へマージするかは、確認してから手で行ってください。
      確認したら approve で終了します。
    options: [approve]
    on_reject: skip
